version: '3.8'

services:
  # PostgreSQL Database (Production)
  postgres:
    image: postgres:16-alpine
    container_name: mini_uber_db_prod
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./scripts/backup:/backups
      - /etc/postgresql/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - mini_uber_prod_network
    security_opt:
      - no-new-privileges:true
    labels:
      - "com.example.description=Mini Uber PostgreSQL Database (Production)"

  # Backend API (Production)
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
      cache_from:
        - mini-uber-api:latest
    image: mini-uber-api:${VERSION:-latest}
    container_name: mini_uber_api_prod
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-43200}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-WARNING}
      CORS_ORIGINS: ${CORS_ORIGINS}
      SENTRY_DSN: ${SENTRY_DSN}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mini_uber_prod_network
    security_opt:
      - no-new-privileges:true
    labels:
      - "com.example.description=Mini Uber FastAPI Backend (Production)"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=api"

  # Frontend Application (Production)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      cache_from:
        - mini-uber-frontend:latest
    image: mini-uber-frontend:${VERSION:-latest}
    container_name: mini_uber_web_prod
    environment:
      VITE_API_BASE: ${VITE_API_BASE}
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - mini_uber_prod_network
    security_opt:
      - no-new-privileges:true
    labels:
      - "com.example.description=Mini Uber React Frontend (Production)"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=frontend"

  # Optional: Monitoring with Prometheus (Production)
  # prometheus:
  #   image: prom/prometheus:latest
  #   container_name: mini_uber_monitoring
  #   volumes:
  #     - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
  #     - prometheus_data:/prometheus
  #   ports:
  #     - "9090:9090"
  #   restart: unless-stopped
  #   networks:
  #     - mini_uber_prod_network

volumes:
  postgres_prod_data:
    driver: local

networks:
  mini_uber_prod_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
